DATALOADER:
  TRAIN_X:
    BATCH_SIZE: 2
  TEST:
    BATCH_SIZE: 20
  NUM_WORKERS: 2

INPUT:
  SIZE: (224, 224)
  INTERPOLATION: "bicubic"
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
  TRANSFORMS: ["random_resized_crop", "normalize"]

OPTIM:
  NAME: "adam"
  LR: 0.0001
  MAX_EPOCH: 60
  LR_SCHEDULER: "cosine"
  WARMUP_EPOCH: 2
  WARMUP_TYPE: "constant"
  WARMUP_CONS_LR: 1e-5

TRAIN:
  PRINT_FREQ: 10

MODEL:
  BACKBONE:
    NAME: "ViT-B/16"

TRAINER:
  BIOMEDCOOP:
    CTX_INIT: "a photo of a"
    SCCM_LAMBDA: 0.75
    KDSP_LAMBDA: 0.75
    TAU: 1.5
    N_PROMPTS: 50

  ANOMALY_DETECT:
    PREC: "fp32"
    LAMBDA_CONSIST: 0.5
    THRESHOLD_STD: 1.5
    PATCH_TEMPERATURE: 0.07
    MEMORY_BANK_PATH: "memory_bank_thymoma.pt"
    MASK_MODE: true
    BG_FACTOR: 0.3
    LAMBDA_FUSION: 0.7
    GEN_MODE: true
    VOCAB_PATH: "data/Thymoma/vocab.pkl"
    CAPTION_JSON: "data/Thymoma/captions.json"
    TAGS_JSON: "data/Thymoma/thymoma_tags.json"
    S_MAX: 8
    N_MAX: 50
    LAMBDA_TAG: 0.5
    LAMBDA_STOP: 0.5
    LAMBDA_WORD: 1.0
